<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inviting Husky to Discord...</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/webp" href="../favicon.webp">
    <link rel="icon" type="image/png" href="../favicon.png?v=2">
    <link rel="icon" type="image/x-icon" href="../favicon.ico?v=2">

    <!-- Fallback meta refresh if JavaScript is disabled -->
    <meta http-equiv="refresh" content="1; url=https://discord.com/oauth2/authorize?client_id=1531753467264241994&permissions=8&scope=bot%20applications.commands">

    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #090a0f;
            --bg-card: #171922;
            --accent: #5865f2;
            --accent-hover: #4752c4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .redirect-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 44px 36px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 16px 36px -4px rgba(0, 0, 0, 0.5);
        }

        .avatar-box {
            position: relative;
            display: inline-block;
            margin-bottom: 24px;
        }

        .bot-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: block;
            border: 3px solid var(--accent);
        }

        .spinner-ring {
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--accent);
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h1 {
            font-size: 1.45rem;
            font-weight: 800;
            margin-bottom: 10px;
            color: #ffffff;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .btn-redirect {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: var(--accent);
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 12px 24px;
            border-radius: var(--radius-md);
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .btn-redirect:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn-discord-svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
    </style>

    <!-- Load project config -->
    <script src="../config.js" onerror="this.src='/config.js'"></script>
</head>

<body>
    <div class="redirect-card">
        <div class="avatar-box">
            <div class="spinner-ring"></div>
            <img src="../favicon.webp" alt="Husky Bot" class="bot-avatar">
        </div>

        <h1>Redirecting to Discord...</h1>
        <p>Taking you to the official Discord authorization page to invite Husky to your server.</p>

        <a href="https://discord.com/oauth2/authorize?client_id=1531753467264241994&permissions=8&scope=bot%20applications.commands"
            class="btn-redirect" id="inviteBtn" data-link="bot-invite">
            <svg class="btn-discord-svg" viewBox="0 0 24 24">
                <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
            </svg>
            Click here if not redirected
        </a>
    </div>

    <!-- Instant redirect script using config.js -->
    <script>
        (function executeRedirect() {
            const defaultUrl = "https://discord.com/oauth2/authorize?client_id=1531753467264241994&permissions=8&scope=bot%20applications.commands";
            const targetUrl = (window.CONFIG && window.CONFIG.botInvite) ? window.CONFIG.botInvite : defaultUrl;
            
            const btn = document.getElementById('inviteBtn');
            if (btn) {
                btn.href = targetUrl;
            }

            // Perform instant redirect
            window.location.replace(targetUrl);
        })();
    </script>
</body>

</html>
